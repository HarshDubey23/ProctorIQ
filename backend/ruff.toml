# Explicit rule set so CI does not change behaviour when ruff's defaults change.
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
# StrEnum changes str() output; keep (str, Enum) for wire compatibility.
ignore = ["UP042"]

[lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once by design.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body",
    "fastapi.Path", "fastapi.File", "fastapi.Form", "fastapi.Security",
]
