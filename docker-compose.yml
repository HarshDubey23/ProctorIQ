services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - CORS_ORIGINS=["http://localhost:3000","https://proctoriq-exam.vercel.app"]
      - SQLITE_PATH=data/proctoriq.db
      - PUBLIC_API_BASE_URL=http://localhost:8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
